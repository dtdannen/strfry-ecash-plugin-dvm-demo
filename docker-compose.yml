services:
  strfry-ecash:
    build:
      context: ./strfry
      dockerfile: Dockerfile
    container_name: strfry-ecash-relay
    ports:
      - "7788:7777"
    volumes:
      # Mount configuration file with ecash plugin
      - ./strfry/strfry.conf:/opt/strfry/strfry.conf:ro
      # Persist database
      - strfry-ecash-db:/data/strfry-db
      # Mount plugins directory (for your custom ecash plugin)
      - ./strfry/plugins:/plugins
    networks:
      - ecash-demo
    restart: unless-stopped

  strfry-plain:
    build:
      context: ./strfry
      dockerfile: Dockerfile
    container_name: strfry-plain-relay
    ports:
      - "7789:7777"
    volumes:
      # Mount plain configuration (no plugin)
      - ./strfry/strfry-plain.conf:/opt/strfry/strfry.conf:ro
      # Persist database
      - strfry-plain-db:/data/strfry-db
    networks:
      - ecash-demo
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: mint-postgres
    ports:
      - "5443:5432"
    environment:
      POSTGRES_DB: cdk_mint
      POSTGRES_USER: mint
      POSTGRES_PASSWORD: mint_password_change_in_production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecash-demo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mint -d cdk_mint"]
      interval: 5s
      timeout: 5s
      retries: 5

  cdk-mint:
    build: .
    container_name: cdk-mint
    ports:
      - "8096:8096"
    volumes:
      - ./config.toml:/root/.cdk-mintd/config.toml:ro
      - mint-data:/root/.cdk-mintd/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecash-demo

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_DVM_NPUB=npub13lx4ddje7jflxm6fhrt35gvhcczcm8radxr50vzcj0zu30w95thq3gfast
        - NEXT_PUBLIC_DVM_PUBKEY_HEX=8fcd56b659f493f36f49b8d71a2197c6058d9c7d698747b05893c5c8bdc5a2ee
        - NEXT_PUBLIC_RELAY_URL=ws://localhost:7789
        - NEXT_PUBLIC_ECASH_RELAY_URL=ws://localhost:7788
        - NEXT_PUBLIC_ECASH_DVM_NPUB=npub19k0w48cr0lr3zqeh9jna9nfv8m2u9chgyh6y3rw7l936asvr0dkq8ygmpl
        - NEXT_PUBLIC_ECASH_DVM_PUBKEY_HEX=2d9eea9f037fc71103372ca7d2cd2c3ed5c2e2e825f4488ddef963aec1837b6c
    container_name: ecash-webapp
    ports:
      - "3011:3000"
    environment:
      - MINT_URL=http://cdk-mint:8096
      - NEXT_PUBLIC_DVM_NPUB=npub13lx4ddje7jflxm6fhrt35gvhcczcm8radxr50vzcj0zu30w95thq3gfast
      - NEXT_PUBLIC_DVM_PUBKEY_HEX=8fcd56b659f493f36f49b8d71a2197c6058d9c7d698747b05893c5c8bdc5a2ee
      - NEXT_PUBLIC_RELAY_URL=ws://localhost:7789
      - NEXT_PUBLIC_ECASH_RELAY_URL=ws://localhost:7788
      - NEXT_PUBLIC_ECASH_DVM_NPUB=npub19k0w48cr0lr3zqeh9jna9nfv8m2u9chgyh6y3rw7l936asvr0dkq8ygmpl
      - NEXT_PUBLIC_ECASH_DVM_PUBKEY_HEX=2d9eea9f037fc71103372ca7d2cd2c3ed5c2e2e825f4488ddef963aec1837b6c
    volumes:
      - dvm-data:/dvm-data:ro
    depends_on:
      - cdk-mint
      - dvm-echo
    networks:
      - ecash-demo
    restart: unless-stopped

  dvm-echo:
    build:
      context: ./dvm
      dockerfile: Dockerfile
    container_name: dvm-echo
    environment:
      - RELAY_URL=ws://strfry-plain:7777
    volumes:
      - dvm-data:/data
    depends_on:
      - strfry-plain
    networks:
      - ecash-demo
    restart: unless-stopped

  dvm-encrypted:
    build:
      context: ./encrypted_dvm
      dockerfile: Dockerfile
    container_name: dvm-encrypted
    environment:
      - RELAY_URL=ws://strfry-plain:7777
    volumes:
      - dvm-encrypted-data:/data
    depends_on:
      - strfry-plain
    networks:
      - ecash-demo
    restart: unless-stopped

  dvm-encrypted-ecash:
    build:
      context: ./encrypted_ecash_dvm
      dockerfile: Dockerfile
    container_name: dvm-encrypted-ecash
    environment:
      - RELAY_URL=ws://strfry-ecash:7777
      - MINT_URL=http://cdk-mint:8096
      - REQUIRED_SATS=1
    volumes:
      - dvm-encrypted-ecash-data:/data
    depends_on:
      - strfry-ecash
      - cdk-mint
    networks:
      - ecash-demo
    restart: unless-stopped

networks:
  ecash-demo:
    driver: bridge

volumes:
  strfry-ecash-db:
  strfry-plain-db:
  mint-data:
  postgres-data:
  dvm-data:
  dvm-encrypted-data:
  dvm-encrypted-ecash-data:
