services:
  strfry-ecash:
    build:
      context: ./strfry
      dockerfile: Dockerfile
    container_name: strfry-ecash-relay
    ports:
      - "7788:7777"
    volumes:
      # Mount configuration file with ecash plugin
      - ./strfry/strfry.conf:/opt/strfry/strfry.conf:ro
      # Persist database
      - strfry-ecash-db:/data/strfry-db
      # Mount plugins directory (for your custom ecash plugin)
      - ./strfry/plugins:/plugins
    networks:
      - ecash-demo
    restart: unless-stopped

  strfry-plain:
    build:
      context: ./strfry
      dockerfile: Dockerfile
    container_name: strfry-plain-relay
    ports:
      - "7789:7777"
    volumes:
      # Mount plain configuration (no plugin)
      - ./strfry/strfry-plain.conf:/opt/strfry/strfry.conf:ro
      # Persist database
      - strfry-plain-db:/data/strfry-db
    networks:
      - ecash-demo
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: mint-postgres
    ports:
      - "5443:5432"
    environment:
      POSTGRES_DB: cdk_mint
      POSTGRES_USER: mint
      POSTGRES_PASSWORD: mint_password_change_in_production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecash-demo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mint -d cdk_mint"]
      interval: 5s
      timeout: 5s
      retries: 5

  cdk-mint:
    build: .
    container_name: cdk-mint
    ports:
      - "8096:8096"
    volumes:
      - ./config.toml:/root/.cdk-mintd/config.toml:ro
      - mint-data:/root/.cdk-mintd/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecash-demo

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_DVM_NPUB=npub1ka5cha8ryglxfelvyt6uyfe5224mgzu26c4utm8tkz8ukwjh279sr0af2q
        - NEXT_PUBLIC_DVM_PUBKEY_HEX=b7698bf4e3223e64e7ec22f5c2273452abb40b8ad62bc5ecebb08fcb3a57578b
        - NEXT_PUBLIC_ENCRYPTED_DVM_NPUB=npub1s5q6q334a7590q9ngurddpf6czmw8kf8vr7kxg4u0p36qpt558aq23wlvr
        - NEXT_PUBLIC_ENCRYPTED_DVM_PUBKEY_HEX=8501a04635efa85780b34706d6853ac0b6e3d92760fd6322bc7863a00574a1fa
        - NEXT_PUBLIC_RELAY_URL=ws://localhost:7789
        - NEXT_PUBLIC_ECASH_RELAY_URL=ws://localhost:7788
        - NEXT_PUBLIC_ECASH_DVM_NPUB=npub107gx7ld4g6u83cq22rrgus3fqj44sqxul9s9z7kp6jjmdd392edsjtnh7e
        - NEXT_PUBLIC_ECASH_DVM_PUBKEY_HEX=7f906f7db546b878e00a50c68e422904ab5800dcf960517ac1d4a5b6b625565b
    container_name: ecash-webapp
    ports:
      - "3011:3000"
    environment:
      - MINT_URL=http://cdk-mint:8096
      - NEXT_PUBLIC_DVM_NPUB=npub1ka5cha8ryglxfelvyt6uyfe5224mgzu26c4utm8tkz8ukwjh279sr0af2q
      - NEXT_PUBLIC_DVM_PUBKEY_HEX=b7698bf4e3223e64e7ec22f5c2273452abb40b8ad62bc5ecebb08fcb3a57578b
      - NEXT_PUBLIC_RELAY_URL=ws://localhost:7789
      - NEXT_PUBLIC_ECASH_RELAY_URL=ws://localhost:7788
      - NEXT_PUBLIC_ECASH_DVM_NPUB=npub107gx7ld4g6u83cq22rrgus3fqj44sqxul9s9z7kp6jjmdd392edsjtnh7e
      - NEXT_PUBLIC_ECASH_DVM_PUBKEY_HEX=7f906f7db546b878e00a50c68e422904ab5800dcf960517ac1d4a5b6b625565b
    volumes:
      - dvm-data:/dvm-data:ro
    depends_on:
      - cdk-mint
      - dvm-echo
    networks:
      - ecash-demo
    restart: unless-stopped

  dvm-echo:
    build:
      context: ./dvm
      dockerfile: Dockerfile
    container_name: dvm-echo
    environment:
      - RELAY_URL=ws://strfry-plain:7777
      - DVM_SECRET_KEY=nsec1485qpda8kvhvxsqf6nv0erf5gmjusd4zgfennxflxkk0qrtwapysk4z4lf
    volumes:
      - dvm-data:/data
    depends_on:
      - strfry-plain
    networks:
      - ecash-demo
    restart: unless-stopped

  dvm-encrypted:
    build:
      context: ./encrypted_dvm
      dockerfile: Dockerfile
    container_name: dvm-encrypted
    environment:
      - RELAY_URL=ws://strfry-plain:7777
      - DVM_SECRET_KEY=nsec1a98gptdp9k747gdplvq5xcrmevfk5ewwwzp9ay7r5nyayspn5x6qkeq3cv
    volumes:
      - dvm-encrypted-data:/data
    depends_on:
      - strfry-plain
    networks:
      - ecash-demo
    restart: unless-stopped

  dvm-encrypted-ecash:
    build:
      context: ./encrypted_ecash_dvm
      dockerfile: Dockerfile
    container_name: dvm-encrypted-ecash
    environment:
      - RELAY_URL=ws://strfry-ecash:7777
      - MINT_URL=http://cdk-mint:8096
      - REQUIRED_SATS=1
      - DVM_SECRET_KEY=nsec1whhz643vtw80hh7qmcxg827w8r2gd909e9twjrf857fte3gxmfgqvj48vg
    volumes:
      - dvm-encrypted-ecash-data:/data
    depends_on:
      - strfry-ecash
      - cdk-mint
    networks:
      - ecash-demo
    restart: unless-stopped

networks:
  ecash-demo:
    driver: bridge

volumes:
  strfry-ecash-db:
  strfry-plain-db:
  mint-data:
  postgres-data:
  dvm-data:
  dvm-encrypted-data:
  dvm-encrypted-ecash-data:
