services:
  strfry:
    build:
      context: ./strfry
      dockerfile: Dockerfile
    container_name: strfry-relay
    ports:
      - "7777:7777"
    volumes:
      # Mount configuration file
      - ./strfry/strfry.conf:/opt/strfry/strfry.conf:ro
      # Persist database
      - strfry-db:/data/strfry-db
      # Mount plugins directory (for your custom ecash plugin)
      - ./strfry/plugins:/plugins
    networks:
      - ecash-demo
    restart: unless-stopped

  cdk-mint:
    build: .
    container_name: cdk-mint
    ports:
      - "8085:8085"
    volumes:
      - ./config.toml:/root/.cdk-mintd/config.toml:ro
      - mint-data:/root/.cdk-mintd/data
    restart: unless-stopped
    networks:
      - ecash-demo

networks:
  ecash-demo:
    driver: bridge

volumes:
  strfry-db:
  mint-data:
