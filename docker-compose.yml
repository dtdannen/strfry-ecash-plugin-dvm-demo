services:
  strfry:
    build:
      context: ./strfry
      dockerfile: Dockerfile
    container_name: strfry-relay
    ports:
      - "7788:7777"
    volumes:
      # Mount configuration file
      - ./strfry/strfry.conf:/opt/strfry/strfry.conf:ro
      # Persist database
      - strfry-db:/data/strfry-db
      # Mount plugins directory (for your custom ecash plugin)
      - ./strfry/plugins:/plugins
    networks:
      - ecash-demo
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: mint-postgres
    ports:
      - "5443:5432"
    environment:
      POSTGRES_DB: cdk_mint
      POSTGRES_USER: mint
      POSTGRES_PASSWORD: mint_password_change_in_production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecash-demo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mint -d cdk_mint"]
      interval: 5s
      timeout: 5s
      retries: 5

  cdk-mint:
    build: .
    container_name: cdk-mint
    ports:
      - "8096:8096"
    volumes:
      - ./config.toml:/root/.cdk-mintd/config.toml:ro
      - mint-data:/root/.cdk-mintd/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecash-demo

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_DVM_NPUB=npub13lx4ddje7jflxm6fhrt35gvhcczcm8radxr50vzcj0zu30w95thq3gfast
        - NEXT_PUBLIC_DVM_PUBKEY_HEX=8fcd56b659f493f36f49b8d71a2197c6058d9c7d698747b05893c5c8bdc5a2ee
        - NEXT_PUBLIC_RELAY_URL=ws://localhost:7788
    container_name: ecash-webapp
    ports:
      - "3011:3000"
    environment:
      - MINT_URL=http://cdk-mint:8096
      - NEXT_PUBLIC_DVM_NPUB=npub13lx4ddje7jflxm6fhrt35gvhcczcm8radxr50vzcj0zu30w95thq3gfast
      - NEXT_PUBLIC_DVM_PUBKEY_HEX=8fcd56b659f493f36f49b8d71a2197c6058d9c7d698747b05893c5c8bdc5a2ee
      - NEXT_PUBLIC_RELAY_URL=ws://localhost:7788
    volumes:
      - dvm-data:/dvm-data:ro
    depends_on:
      - cdk-mint
      - dvm-echo
    networks:
      - ecash-demo
    restart: unless-stopped

  dvm-echo:
    build:
      context: ./dvm
      dockerfile: Dockerfile
    container_name: dvm-echo
    environment:
      - RELAY_URL=ws://strfry:7777
    volumes:
      - dvm-data:/data
    depends_on:
      - strfry
    networks:
      - ecash-demo
    restart: unless-stopped

  dvm-encrypted:
    build:
      context: ./encrypted_dvm
      dockerfile: Dockerfile
    container_name: dvm-encrypted
    environment:
      - RELAY_URL=ws://strfry:7777
    volumes:
      - dvm-encrypted-data:/data
    depends_on:
      - strfry
    networks:
      - ecash-demo
    restart: unless-stopped

networks:
  ecash-demo:
    driver: bridge

volumes:
  strfry-db:
  mint-data:
  postgres-data:
  dvm-data:
  dvm-encrypted-data:
