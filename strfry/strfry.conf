##
## Default strfry config
##

# Directory that contains the strfry LMDB database (restart required)
db = "/data/strfry-db/"

dbParams {
    # Maximum number of threads/processes that can simultaneously have LMDB transactions open (restart required)
    maxreaders = 256

    # Size of mmap() to use when loading LMDB (default is 10TB, does *not* correspond to disk-space used) (restart required)
    mapsize = 10995116277760
}

events {
    # Maximum size of normalised JSON, in bytes
    maxEventSize = 65536

    # Events newer than this will be rejected
    rejectEventsNewerThanSeconds = 900

    # Events older than this will be rejected
    rejectEventsOlderThanSeconds = 94608000

    # Ephemeral events older than this will be rejected
    rejectEphemeralEventsOlderThanSeconds = 60

    # Ephemeral events will be deleted from the DB when older than this
    ephemeralEventsLifetimeSeconds = 300

    # Maximum number of tags allowed
    maxNumTags = 2000

    # Maximum size for tag values, in bytes
    maxTagValSize = 1024
}

relay {
    # Interface to listen on. Use 0.0.0.0 to listen on all interfaces (default: 127.0.0.1)
    bind = "0.0.0.0"

    # Port to open for the relay (default: 7777)
    port = 7777

    # Set OS-limit on maximum number of open files/sockets (if 0, don't attempt to set) (default: 0)
    nofiles = 0

    # HTTP header that contains the client's real IP, before reverse proxying (default: X-Forwarded-For)
    realIpHeader = "X-Forwarded-For"

    info {
        # NIP-11: Name of this server. Short/descriptive (< 30 characters) (default: "strfry default")
        name = "strfry-ecash-relay"

        # NIP-11: Detailed information about relay, free-form (default: "")
        description = "Nostr relay with ecash payment verification"

        # NIP-11: Administrative nostr pubkey, for contact purposes (default: "")
        pubkey = ""

        # NIP-11: Alternative administrative contact (email, website, etc) (default: "")
        contact = ""
    }

    # Maximum accepted incoming websocket frame size (should be larger than max event and yesstr msg) (default: 131072)
    maxWebsocketPayloadSize = 131072

    # Websocket-level PING message frequency (should be less than any reverse proxy idle timeouts) (default: 55)
    autoPingSeconds = 55

    # If TCP keep-alive should be enabled (detect dropped connections to upstream reverse proxy) (default: true)
    enableTcpKeepalive = true

    # How much uninterrupted CPU time a REQ query should get during its DB scan (default: 0.500000)
    queryTimesliceBudgetMicroseconds = 500000

    # Maximum records that can be returned per filter (default: 500)
    maxFilterLimit = 500

    # Maximum number of subscriptions (concurrent REQs) a connection can have open at any time (default: 20)
    maxSubsPerConnection = 20

    writePolicy {
        # If non-empty, path to an executable script that implements the writePolicy plugin logic (default: "")
        # For ecash plugin integration - you'll add your plugin here
        plugin = ""
    }

    compression {
        # Use permessage-deflate compression if supported by client. Reduces bandwidth, but slight increase in CPU (default: true)
        enabled = true

        # Maintain a sliding window buffer for each connection. Improves compression, but uses more memory (default: true)
        slidingWindow = true
    }

    logging {
        # Dump all incoming messages (default: false)
        dumpInAll = false

        # Dump all incoming EVENT messages (default: false)
        dumpInEvents = false

        # Dump all incoming REQ/CLOSE messages (default: false)
        dumpInReqs = false

        # Log performance metrics for initial REQ database scans (default: true)
        dbScanPerf = true

        # Log reason for invalid event rejection? Can be disabled to silence excessive logging (default: true)
        invalidEvents = true
    }

    numThreads {
        # Ingester threads: route incoming requests, validate events/sigs (default: 3)
        ingester = 3

        # reqWorker threads: Handle initial DB scan for REQs (default: 3)
        reqWorker = 3

        # reqMonitor threads: Handle filtering of new events (default: 3)
        reqMonitor = 3

        # negentropy threads: Handle negentropy protocol messages (default: 2)
        negentropy = 2
    }

    negentropy {
        # Support negentropy protocol messages (default: true)
        enabled = true

        # Maximum records that sync will process before returning an error (default: 1000000)
        maxSyncEvents = 1000000
    }
}

